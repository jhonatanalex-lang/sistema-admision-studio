    <script>
      // Saneamiento inmediato de localStorage e interceptor de JSON.parse para evitar bloqueos por iframe/preview
      (function() {
        try {
          // Prevenir error 'Cannot set property fetch of #<Window> which has only a getter'
          var nativeFetch = window.fetch;
          var activeFetch = nativeFetch ? nativeFetch.bind(window) : undefined;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(newFetch) {
                activeFetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          } catch(err) {
            console.warn("Could not define custom fetch descriptor:", err);
          }

          // Limpiar claves corruptas existentes
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            if (key) {
              var val = localStorage.getItem(key);
              if (val === 'undefined' || val === 'null' || val === '[object Object]') {
                localStorage.removeItem(key);
                i--;
              }
            }
          }
          
          // Interceptador de localStorage.getItem
          var originalGetItem = localStorage.getItem;
          localStorage.getItem = function(key) {
            var val = originalGetItem.call(localStorage, key);
            if (val === 'undefined' || val === 'null') {
              try { localStorage.removeItem(key); } catch(e){}
              return null;
            }
            return val;
          };

          // Interceptador de JSON.parse ultra-seguro
          var originalParse = JSON.parse;
          JSON.parse = function(text, reviver) {
            if (text === undefined || text === 'undefined') {
              console.warn("JSON.parse interceptado para evitar error con 'undefined'");
              return undefined;
            }
            if (text === null || text === 'null') {
              return null;
            }
            try {
              return originalParse.call(JSON, text, reviver);
            } catch (err) {
              // Si falla y el texto contiene "undefined", intentar sanearlo o retornar un objeto vacío/fallback
              if (typeof text === 'string' && text.indexOf('undefined') !== -1) {
                console.warn("Error de parseo debido a 'undefined' incrustado, retornando fallback:", err);
                return {};
              }
              throw err;
            }
          };
          // Redirección canónica para Netlify y enlaces directos de validación/verificación:
          if (window.location && window.location.pathname) {
            var pName = window.location.pathname;
            if (pName.indexOf('/validar') === 0 || pName.indexOf('/verificar') === 0) {
              var targetHash = '#' + pName + (window.location.search || '');
              window.location.replace('/' + targetHash);
            }
          }
        } catch (e) {
          console.warn("No se pudo inicializar saneamiento preventivo:", e);
        }
      })();
    </script>

    <!-- Configuración de Favicon e Identificación Dinámica por Entorno (Desarrollo / Producción) -->
    <script>
      (function() {
        function setupDynamicFavicon() {
          try {
            var host = window.location.hostname || '';
            var port = window.location.port || '';
            var search = window.location.search || '';
            
            // Determinar si es entorno de desarrollo
            var forceProd = search.indexOf('env=prod') !== -1;
            var forceDev = search.indexOf('env=dev') !== -1;
            var isDev = !forceProd && (
              forceDev ||
              host === 'localhost' ||
              host === '127.0.0.1' ||
              host === '0.0.0.0' ||
              host.indexOf('dev') !== -1 ||
              (port !== '' && port !== '80' && port !== '443')
            );

            var favicon = document.getElementById('app-favicon');
            if (!favicon) {
              favicon = document.querySelector("link[rel*='icon']");
              if (favicon) {
                favicon.id = 'app-favicon';
              } else {
                favicon = document.createElement('link');
                favicon.id = 'app-favicon';
                favicon.rel = 'icon';
                document.head.appendChild(favicon);
              }
            }

            // Título de pestaña distintivo
            var baseTitle = 'Dirección de Admisión · UNSAAC';
            if (isDev) {
              if (!document.title.startsWith('[DEV] ')) {
                document.title = '[DEV] ' + (document.title.replace(/^\[DEV\]\s*/, '') || baseTitle);
              }
            } else {
              if (document.title.startsWith('[DEV] ')) {
                document.title = document.title.replace(/^\[DEV\]\s*/, '') || baseTitle;
              }
            }

            // Observador para mantener el prefijo [DEV] si las rutas de React cambian document.title
            if (isDev && window.MutationObserver && !window.__devTitleObserverAttached) {
              window.__devTitleObserverAttached = true;
              var titleEl = document.querySelector('title');
              if (titleEl) {
                var titleObserver = new MutationObserver(function() {
                  if (!document.title.startsWith('[DEV] ')) {
                    document.title = '[DEV] ' + document.title;
                  }
                });
                titleObserver.observe(titleEl, { childList: true, characterData: true, subtree: true });
              }
            }

            if (isDev) {
              // Favicon para Desarrollo: Escudo UNSAAC con distintivo sutil 'DEV' en ámbar institucional
              var devSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">' +
                '<rect width="64" height="64" rx="14" fill="#090d16"/>' +
                '<rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#e8a134" stroke-width="2.5" stroke-opacity="0.8"/>' +
                '<path d="M32 9 L49 15 V33 C49 44 32 53 32 53 C32 53 15 44 15 33 V15 Z" fill="#9b192d" stroke="#e8a134" stroke-width="2.5"/>' +
                '<path d="M32 15 L43 20 V31 C43 39 32 46 32 46 C32 46 21 39 21 31 V20 Z" fill="#7b1523"/>' +
                '<circle cx="32" cy="27" r="4.5" fill="#e8a134"/>' +
                '<rect x="26" y="42" width="36" height="19" rx="5" fill="#f59e0b" stroke="#090d16" stroke-width="2"/>' +
                '<text x="44" y="55.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5" font-weight="900" fill="#090d16" text-anchor="middle" letter-spacing="0.5">DEV</text>' +
                '</svg>';

              favicon.type = 'image/svg+xml';
              favicon.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(devSvg);

              // Enriquecer con el isotipo oficial bitmap si carga correctamente
              var img = new Image();
              img.crossOrigin = 'anonymous';
              img.src = '/logo_admision.png';
              img.onload = function() {
                try {
                  var canvas = document.createElement('canvas');
                  canvas.width = 64;
                  canvas.height = 64;
                  var ctx = canvas.getContext('2d');
                  if (!ctx) return;

                  ctx.fillStyle = '#090d16';
                  if (ctx.roundRect) {
                    ctx.beginPath();
                    ctx.roundRect(0, 0, 64, 64, 14);
                    ctx.fill();
                    ctx.lineWidth = 2.5;
                    ctx.strokeStyle = '#e8a134';
                    ctx.stroke();
                  } else {
                    ctx.fillRect(0, 0, 64, 64);
                  }

                  ctx.drawImage(img, 7, 6, 50, 50);

                  ctx.fillStyle = '#f59e0b';
                  ctx.strokeStyle = '#090d16';
                  ctx.lineWidth = 2;
                  if (ctx.roundRect) {
                    ctx.beginPath();
                    ctx.roundRect(26, 42, 36, 19, 5);
                    ctx.fill();
                    ctx.stroke();
                  } else {
                    ctx.fillRect(26, 42, 36, 19);
                    ctx.strokeRect(26, 42, 36, 19);
                  }

                  ctx.fillStyle = '#090d16';
                  ctx.font = '900 11px system-ui, -apple-system, sans-serif';
                  ctx.textAlign = 'center';
                  ctx.textBaseline = 'middle';
                  ctx.fillText('DEV', 44, 52);

                  favicon.type = 'image/png';
                  favicon.href = canvas.toDataURL('image/png');
                } catch (e) {
                  // Fallback vector SVG ya se encuentra aplicado
                }
              };
            } else {
              // Favicon Producción: Escudo oficial limpio sin etiquetas
              favicon.type = 'image/png';
              favicon.href = 'https://cnqpzyanmmwspvemcfeb.supabase.co/storage/v1/object/public/logos/escudo%20oficial-02%20(2).png';
            }
          } catch (e) {
            console.warn('No se pudo inicializar favicon dinámico:', e);
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setupDynamicFavicon);
        } else {
          setupDynamicFavicon();
        }

        window.__setFaviconEnvironment = function(mode) {
          var url = new URL(window.location.href);
          if (mode === 'dev') {
            url.searchParams.set('env', 'dev');
          } else {
            url.searchParams.set('env', 'prod');
          }
          window.history.replaceState(null, '', url.toString());
          setupDynamicFavicon();
        };
      })();
    </script>
